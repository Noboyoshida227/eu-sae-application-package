name: quality

on:
  push:
  pull_request:

jobs:
  parse-and-targeted-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - name: Parse and run dependency-light tests
        run: Rscript tests/run_tests.R
